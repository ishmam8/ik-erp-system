[tool:pytest]
DJANGO_SETTINGS_MODULE = jewelops.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=accounting_ledger
    --cov-report=html
    --cov-report=term-missing
markers =
    django_db: mark test to use Django database
    slow: mark test as slow running